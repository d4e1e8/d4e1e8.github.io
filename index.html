<div id="art-modal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-top">
    <div class="modal-info">
      <span class="modal-title" id="modalTitle"></span>
      <span class="modal-dims" id="modalDims"></span>
    </div>
    <button class="modal-close" id="closeModalBtn" title="close (esc)">[×]</button>
  </div>

  <img class="modal-content" id="modal-img" alt="">

  <div class="modal-nav modal-prev" id="prevBtn" title="prev (←)">‹</div>
  <div class="modal-nav modal-next" id="nextBtn" title="next (→)">›</div>

  <div class="modal-bottom" id="zoomBar">
    <span class="counter" id="counter">[0/0]</span>
    <span class="divider">·</span>
    <button class="zoom-btn" id="minusBtn" title="zoom out (−)">[−]</button>
    <button class="zoom-btn zoom-reset" id="zoomVal" title="reset (r)">[1×]</button>
    <button class="zoom-btn" id="plusBtn" title="zoom in (+)">[+]</button>
  </div>
</div>
