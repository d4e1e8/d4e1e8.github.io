<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>canv — drawings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Fixed background dots layer (static while scrolling) */
    body {
      background: #181A1F;
      position: relative;
      min-height: 100vh;
    }

    .bg-dots {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(93, 204, 186, 0.12) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    body > *:not(.bg-dots) {
      position: relative;
      z-index: 1;
    }

    body {
      color: #D0D5DB;
      font-family: "Fira Code", "JetBrains Mono", "Hack", monospace;
      font-size: 1rem;
      line-height: 1.5;
      padding: 2rem 2rem 4rem 2rem;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 3rem auto;
      text-align: left;
      border-left: 3px solid #5DCCBA;
      padding-left: 1.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 450;
      color: #E5F0EF;
      text-shadow: 0 0 4px rgba(93, 204, 186, 0.3);
      display: inline-block;
      background: #20232A;
      padding-right: 1rem;
    }

    .sub-title {
      font-size: 0.75rem;
      color: #8E9BA8;
      margin-top: 0.75rem;
      border-bottom: 1px dashed #2C3E3B;
      display: inline-block;
      padding-bottom: 0.25rem;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4rem;
      max-width: 100%;
      margin: 0 auto;
      width: 100%;
    }

    .art-card {
      width: 100%;
      text-align: center;
    }

    .art-card img {
      display: block;
      margin: 0 auto;
      border: 2px solid #3E5D58;
      background: #111317;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px #2F4E48 inset;
      cursor: zoom-in;
      transition: border 0.1s, box-shadow 0.1s;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      -ms-interpolation-mode: nearest-neighbor;
      width: auto;
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }

    .art-card img:hover {
      border-color: #5DCCBA;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.6), 0 0 0 1px #5DCCBA inset;
    }

    .art-title {
      font-size: 0.75rem;
      text-align: center;
      margin-top: 1rem;
      color: #A6B3C0;
      font-family: monospace;
      word-break: break-all;
      max-width: 95%;
      margin-left: auto;
      margin-right: auto;
      background: #20232A;
      padding: 0.3rem 0.9rem;
      border-radius: 6px;
      border: 1px solid #3E5D58;
      display: inline-block;
      width: auto;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(18, 20, 24, 0.9);
      backdrop-filter: blur(12px);
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .modal-content {
      max-width: 92vw;
      max-height: 92vh;
      width: auto;
      height: auto;
      background: #111317;
      box-shadow: 0 0 0 2px #2C4A44, 0 20px 40px black;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      transform-origin: center center;
      transition: transform 0.08s linear;
      cursor: grab;
      user-select: none;
      will-change: transform;
    }

    .modal-content:active {
      cursor: grabbing;
    }

    .close-modal {
      position: fixed;
      top: 1.5rem;
      right: 1.8rem;
      background: #20232ACC;
      backdrop-filter: blur(8px);
      border: 1px solid #3E6B64;
      padding: 0.4rem 1rem;
      font-family: monospace;
      font-size: 1.2rem;
      font-weight: 500;
      color: #D0E5E1;
      cursor: pointer;
      z-index: 10001;
      border-radius: 6px;
      letter-spacing: 1px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-modal:hover {
      background: #2D5650;
      border-color: #5DCCBA;
      color: white;
      transform: scale(0.97);
    }

    .zoom-control-bar {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 0.6rem;
      background: #20232AEE;
      backdrop-filter: blur(12px);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      border: 1px solid #3E6B64;
      z-index: 10002;
      align-items: center;
    }

    .zoom-btn {
      background: #111317;
      border: 1px solid #3E6B64;
      color: #CCE8E3;
      font-family: monospace;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.2rem 0.9rem;
      border-radius: 6px;
      min-width: 54px;
      text-align: center;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .zoom-btn:hover {
      background: #2D5650;
      border-color: #5DCCBA;
      color: #ffffff;
      transform: scale(0.96);
    }

    .zoom-value {
      background: #111317;
      padding: 0.2rem 1rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #BBDFD8;
      border: 1px solid #3E6B64;
      min-width: 100px;
      text-align: center;
      line-height: 1.4;
    }

    .counter {
      background: #111317;
      padding: 0.2rem 0.8rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #BBDFD8;
      border: 1px solid #3E6B64;
      letter-spacing: 0.5px;
      line-height: 1.4;
    }

    /* image dimensions + loading indicator (bottom right corner) */
    .modal-info {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      font-size: 0.7rem;
      font-family: monospace;
      color: #8E9BA8;
      background: rgba(18, 20, 24, 0.7);
      backdrop-filter: blur(4px);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10003;
      letter-spacing: 0.3px;
    }

    @media (max-width: 700px) {
      body { padding: 1rem 1rem 4rem 1rem; }
      .zoom-btn { padding: 0.2rem 0.6rem; min-width: 48px; font-size: 1rem; }
      .zoom-value { min-width: 85px; font-size: 0.7rem; padding: 0.2rem 0.6rem; }
      .counter { font-size: 0.7rem; padding: 0.2rem 0.5rem; }
      .close-modal { top: 0.8rem; right: 0.8rem; padding: 0.3rem 0.8rem; }
      .modal-info { font-size: 0.6rem; bottom: 0.5rem; right: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-dots"></div>

  <header>
    <h1>canv</h1>
    <p class="sub-title">updated: <span id="date"></span></p>
  </header>

  <main class="gallery" id="gallery"></main>

  <div id="art-modal" class="modal">
    <span class="close-modal" id="closeModalBtn">[x]</span>
    <img class="modal-content" id="modal-img" alt="Zoomed View">
    <div class="modal-info" id="modalInfo">[loading...]</div>
  </div>

  <script>
    (function() {
      // set current date
      const dateSpan = document.getElementById('date');
      if (dateSpan) {
        const today = new Date();
        dateSpan.textContent = `${today.getMonth()+1}.${today.getDate()}.${today.getFullYear().toString().slice(2)}`;
      }

      // artworks list (unchanged)
      const artworks = [
        { filename: "Untitled-projection;(superpositionFluxSurfaceLevel)operateAbecedarianVegetiveStatesProductionIllimitableNonterminous.png", title: "Untitled-projection;(superpositionFluxSurfaceLevel)operateAbecedarianVegetiveStatesProductionIllimitableNonterminous" },
        { filename: "Untitled-beats,NothingMakesItAnymore001.png", title: "Untitled-beats,NothingMakesItAnymore001" },
        { filename: "Untitled-large001.png", title: "Untitled-large001" },
        { filename: "Untitled-putativeUndulatingParticipable;leapK501.png", title: "Untitled-putativeUndulatingParticipable;leapK501" },
        { filename: "Untitled-ok156X.png", title: "Untitled-ok156X" },
        { filename: "Untitled-plethoraOfTheSamePellucidExisting01.jpg", title: "Untitled-plethoraOfTheSamePellucidExisting01" },
        { filename: "Untitled-xyl-Tribute;perceptionalEndictionariliteral.jpg", title: "Untitled-xyl-Tribute;perceptionalEndictionariliteral" },
        { filename: "Untitled-dissimilationTwiningToOrThenAndAlwaysThenMaybeSomedayToPossibleMomentsThenAlsoAfterNoBefore1.jpg", title: "Untitled-dissimilationTwiningToOrThenAndAlwaysThenMaybeSomedayToPossibleMomentsThenAlsoAfterNoBefore1" },
        { filename: "Untitled-0b0000xfif1.jpg", title: "Untitled-0b0000xfif1" },
        { filename: "Untitled-0b0000xfif2.jpg", title: "Untitled-0b0000xfif2" },
        { filename: "Untitled-nothing000002.jpg", title: "Untitled-nothing000002" },
        { filename: "Untitled-wellnessDocumented;NowEffloresceIntoBlithesome024.jpg", title: "Untitled-wellnessDocumented;NowEffloresceIntoBlithesome024" },
        { filename: "Untitled-dayAndAfter00.jpg", title: "Untitled-dayAndAfter00" },
        { filename: "Untitled-dayAndAfter99.jpg", title: "Untitled-dayAndAfter99" },
        { filename: "Untitled-microThermalIncisionPlasteringSubcorticalDeformingAstralColumnGalvanizingConclusiveExampleSubject001.jpg", title: "Untitled-microThermalIncisionPlasteringSubcorticalDeformingAstralColumnGalvanizingConclusiveExampleSubject001" },
        { filename: "Untitled-forEveryWord001.jpg", title: "Untitled-forEveryWord001" },
        { filename: "Untitled-andThenLooking_cerebralExtension(synapticReconfiguration_decompartmentalizing).jpg", title: "Untitled-andThenLooking_cerebralExtension(synapticReconfiguration_decompartmentalizing)" },
        { filename: "Untitled-everyoneNeedsToBe02.jpg", title: "Untitled-everyoneNeedsToBe02" },
        { filename: "Untitled-friends_92.jpg", title: "Untitled-friends_92" },
        { filename: "Untitled-IHTL2.png", title: "Untitled-IHTL2" },
        { filename: "Untitled-Squash58.jpg", title: "Untitled-Squash58" },
        { filename: "Untitled-enterIDWTEA9902x3.jpg", title: "Untitled-enterIDWTEA9902x3" },
        { filename: "Untitled-watchAsBC6.png", title: "Untitled-watchAsBC6" },
        { filename: "Untitled-alwaysAnd092.png", title: "Untitled-alwaysAnd092" },
        { filename: "Untitled-faces;perturbedFigurePulling.jpg", title: "Untitled-faces;perturbedFigurePulling" },
        { filename: "Untitled-allThatSeaFor10000679.png", title: "Untitled-allThatSeaFor10000679" },
        { filename: "Untitled-coreMemory002.png", title: "Untitled-coreMemory002" },
        { filename: "Untitled-LacerationAndNeighbors.png", title: "Untitled-LacerationAndNeighbors" },
        { filename: "Untitled-phaseB01.png", title: "Untitled-phaseB01" },
        { filename: "Untitled-treatB.19.2075.png", title: "Untitled-treatB.19.2075" },
        { filename: "Untitled-viewFrom1.png", title: "Untitled-viewFrom1" },
        { filename: "Untitled-works0..7.png", title: "Untitled-works0..7" }
      ];

      // render gallery
      const gallery = document.getElementById('gallery');
      if (gallery) {
        const frag = document.createDocumentFragment();
        for (const art of artworks) {
          const article = document.createElement('article');
          article.className = 'art-card';
          const img = document.createElement('img');
          img.src = `images/${art.filename}`;
          img.alt = art.title;
          img.loading = 'lazy';
          const title = document.createElement('h2');
          title.className = 'art-title';
          title.textContent = art.title;
          article.appendChild(img);
          article.appendChild(title);
          frag.appendChild(article);
        }
        gallery.appendChild(frag);
      }

      // modal elements
      const modal = document.getElementById("art-modal");
      const modalImg = document.getElementById("modal-img");
      const closeBtn = document.getElementById("closeModalBtn");
      const modalInfo = document.getElementById("modalInfo");

      let currentIndex = 0;
      let currentZoom = 1;
      let translateX = 0, translateY = 0;
      let isDragging = false;
      let startX = 0, startY = 0;

      // create zoom bar + counter
      const zoomBar = document.createElement('div');
      zoomBar.className = 'zoom-control-bar';

      const counterSpan = document.createElement('span');
      counterSpan.className = 'counter';
      counterSpan.textContent = '[1/32]';

      const minusBtn = document.createElement('button');
      minusBtn.className = 'zoom-btn';
      minusBtn.textContent = '[-]';
      const zoomVal = document.createElement('span');
      zoomVal.className = 'zoom-value';
      zoomVal.textContent = '100% (1x)';
      const plusBtn = document.createElement('button');
      plusBtn.className = 'zoom-btn';
      plusBtn.textContent = '[+]';

      zoomBar.appendChild(counterSpan);
      zoomBar.appendChild(minusBtn);
      zoomBar.appendChild(zoomVal);
      zoomBar.appendChild(plusBtn);
      document.body.appendChild(zoomBar);
      zoomBar.style.display = 'none';

      function updateTransform() {
        modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentZoom})`;
      }

      function setZoom(level) {
        let newLevel = Math.round(level);
        if (newLevel < 1) newLevel = 1;
        if (newLevel > 5) newLevel = 5;
        if (currentZoom === newLevel) return;
        currentZoom = newLevel;
        translateX = 0;
        translateY = 0;
        updateTransform();
        zoomVal.textContent = `${Math.floor(currentZoom * 100)}% (${currentZoom}x)`;
        zoomVal.classList.add('zoom-flash');
        setTimeout(() => zoomVal.classList.remove('zoom-flash'), 100);
        modalImg.style.cursor = 'grab';
      }

      function updateModalForCurrentIndex() {
        const art = artworks[currentIndex];
        if (!art) return;
        // show loading indicator
        modalInfo.textContent = '[loading...]';
        modalImg.style.opacity = '0.8';
        modalImg.src = `images/${art.filename}`;
        modalImg.alt = art.title;
        // reset zoom and pan
        currentZoom = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();
        zoomVal.textContent = '100% (1x)';
        modalImg.style.cursor = 'grab';
        // update counter
        counterSpan.textContent = `[${currentIndex+1}/${artworks.length}]`;
      }

      function openModal(imgSrc, imgAlt, idx) {
        currentIndex = idx;
        modal.style.display = "flex";
        zoomBar.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        document.body.style.touchAction = 'none';
        updateModalForCurrentIndex();
      }

      function closeModal() {
        modal.style.display = "none";
        zoomBar.style.display = 'none';
        document.body.style.overflow = '';
        document.body.style.touchAction = '';
      }

      // navigate next/prev
      function nextImage() {
        if (modal.style.display !== 'flex') return;
        currentIndex = (currentIndex + 1) % artworks.length;
        updateModalForCurrentIndex();
      }

      function prevImage() {
        if (modal.style.display !== 'flex') return;
        currentIndex = (currentIndex - 1 + artworks.length) % artworks.length;
        updateModalForCurrentIndex();
      }

      // drag & pan (any zoom)
      function startDrag(e) {
        if (modal.style.display !== 'flex') return;
        e.preventDefault();
        isDragging = true;
        let clientX, clientY;
        if (e.type === 'mousedown') { clientX = e.clientX; clientY = e.clientY; }
        else if (e.type === 'touchstart') { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
        else return;
        startX = clientX - translateX;
        startY = clientY - translateY;
        modalImg.style.transition = 'none';
        modalImg.style.cursor = 'grabbing';
      }

      function onDrag(e) {
        if (!isDragging || modal.style.display !== 'flex') return;
        e.preventDefault();
        let clientX, clientY;
        if (e.type === 'mousemove') { clientX = e.clientX; clientY = e.clientY; }
        else if (e.type === 'touchmove') { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
        else return;
        translateX = clientX - startX;
        translateY = clientY - startY;
        updateTransform();
      }

      function stopDrag() {
        if (!isDragging) return;
        isDragging = false;
        modalImg.style.transition = '';
        modalImg.style.cursor = 'grab';
      }

      function onWheel(e) {
        if (modal.style.display !== 'flex') return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? -1 : 1;
        setZoom(currentZoom + delta);
      }

      // image load handler: show dimensions
      modalImg.addEventListener('load', () => {
        const w = modalImg.naturalWidth;
        const h = modalImg.naturalHeight;
        modalInfo.textContent = `${w}×${h}`;
        modalImg.style.opacity = '';
      });

      modalImg.addEventListener('error', () => {
        modalInfo.textContent = '[error]';
        modalImg.style.opacity = '';
      });

      // attach click handlers to gallery images
      function bindClicks() {
        document.querySelectorAll('.art-card img').forEach((img, idx) => {
          img.removeEventListener('click', img._handler);
          img._handler = () => openModal(img.src, img.alt, idx);
          img.addEventListener('click', img._handler);
        });
      }

      // event binding
      minusBtn.addEventListener('click', () => { if (modal.style.display === 'flex') setZoom(currentZoom - 1); });
      plusBtn.addEventListener('click', () => { if (modal.style.display === 'flex') setZoom(currentZoom + 1); });
      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
      modal.addEventListener('wheel', onWheel, { passive: false });
      modalImg.addEventListener('mousedown', startDrag);
      modalImg.addEventListener('touchstart', startDrag, { passive: false });
      modalImg.addEventListener('dblclick', (e) => { e.stopPropagation(); setZoom(1); });
      window.addEventListener('mousemove', onDrag);
      window.addEventListener('mouseup', stopDrag);
      window.addEventListener('touchmove', onDrag, { passive: false });
      window.addEventListener('touchend', stopDrag);
      window.addEventListener('keydown', (e) => {
        if (modal.style.display !== 'flex') return;
        if (e.key === 'Escape') closeModal();
        if (e.key === '+' || e.key === '=') setZoom(currentZoom + 1);
        if (e.key === '-') setZoom(currentZoom - 1);
        if (e.key === 'r' || e.key === 'R') setZoom(1);
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
      });

      bindClicks();

      // tiny flash for zoom indicator
      const style = document.createElement('style');
      style.textContent = `.zoom-flash { animation: pulse 0.12s ease-out; } @keyframes pulse { 0% { color: #fff; text-shadow: 0 0 3px #5DCCBA; } 100% { color: #BBDFD8; } }`;
      document.head.appendChild(style);
    })();
  </script>
</body>
</html>
